<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cambodia Listings Tracker — Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  :root {
    --bg: #f6f7f9; --bg-soft: #eef0f3; --card: #ffffff; --ink: #14181d; --ink-soft: #4a5259;
    --muted: #868f99; --line: #e6e8ec;
    --accent: #1d6f52; --accent-ink: #ffffff; --accent-soft: #e6f3ec; --accent-soft-line: #cfe6da;
    --blue: #2f5fa8; --blue-soft: #e9f0fb; --blue-soft-line: #cfe0f5;
    --radius-sm: 8px; --radius-md: 14px; --radius-lg: 18px;
    --shadow-sm: 0 1px 2px rgba(20,24,29,0.05), 0 1px 1px rgba(20,24,29,0.03);
    --shadow-md: 0 8px 24px -8px rgba(20,24,29,0.16), 0 2px 6px rgba(20,24,29,0.06);
    --shadow-lg: 0 20px 48px -12px rgba(20,24,29,0.28), 0 4px 12px rgba(20,24,29,0.1);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215; --bg-soft: #16191d; --card: #191c20; --ink: #eef1f4; --ink-soft: #c4cbd2;
      --muted: #8b939c; --line: #2a2e34;
      --accent: #3fae82; --accent-ink: #0b1210; --accent-soft: #163229; --accent-soft-line: #24493c;
      --blue: #7aa6e8; --blue-soft: #16233a; --blue-soft-line: #24395c;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 24px -8px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.3);
      --shadow-lg: 0 20px 48px -12px rgba(0,0,0,0.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 16px 28px; border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--card) 85%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; z-index: 20; position: relative;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #000 15%));
    box-shadow: var(--shadow-sm);
  }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.8rem; margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .sub a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .sub a:hover { text-decoration: underline; }
  .legend { display: flex; gap: 12px; align-items: center; font-size: 0.76rem; color: var(--muted); }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 18%, transparent); }

  form.filters {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 12px 28px; background: var(--bg-soft); border-bottom: 1px solid var(--line);
    position: relative; z-index: 15;
  }
  form.filters input, form.filters select {
    padding: 7px 11px; border: 1px solid var(--line); border-radius: var(--radius-sm);
    font-size: 0.82rem; background: var(--card); color: var(--ink); font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  form.filters input:focus, form.filters select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  form.filters input[type="number"] { width: 88px; }
  form.filters button {
    padding: 7px 16px; border: none; border-radius: var(--radius-sm); background: var(--accent);
    color: var(--accent-ink); font-size: 0.82rem; font-weight: 600; cursor: pointer;
    box-shadow: var(--shadow-sm); transition: transform .12s, box-shadow .12s, filter .12s;
  }
  form.filters button:hover { filter: brightness(1.08); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  form.filters a.clear-link { align-self: center; font-size: 0.78rem; color: var(--muted); text-decoration: none; font-weight: 500; }
  form.filters a.clear-link:hover { color: var(--ink); text-decoration: underline; }

  #map { flex: 1; }
  .popup-card { width: 232px; font-family: "Inter", sans-serif; }
  .popup-card img { border-radius: 10px; }
  .popup-price { font-weight: 800; font-size: 1.02rem; color: #14181d; letter-spacing: -0.01em; }
  .popup-tags { font-size: 0.72rem; color: #6b7480; margin: 3px 0 7px; font-weight: 500; }
  .popup-text { font-size: 0.8rem; max-height: 4.5em; overflow: hidden; margin-bottom: 8px; color: #2c3238; line-height: 1.4; }
  .popup-links a {
    color: #fff; background: #1d6f52; margin-right: 6px; font-size: 0.74rem; font-weight: 600;
    text-decoration: none; padding: 4px 10px; border-radius: 999px; display: inline-block;
  }
  .popup-precision {
    font-size: 0.7rem; color: #2f5fa8; margin-bottom: 6px; font-weight: 600;
    background: #e9f0fb; display: inline-block; padding: 2px 8px; border-radius: 999px;
  }
  .leaflet-popup-content { margin: 12px; }
  .leaflet-popup-content-wrapper { border-radius: 14px; box-shadow: 0 16px 40px -12px rgba(20,24,29,0.35); }
  .leaflet-control-zoom a { border-radius: var(--radius-sm) !important; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark"></div>
    <h1>Cambodia Listings Tracker — Map</h1>
  </div>
  <div class="sub">
    <span class="legend"><span class="dot" style="background:#1d6f52;color:#1d6f52;"></span>real map link (exact)</span>
    <span class="legend"><span class="dot" style="background:#2f5fa8;color:#2f5fa8;"></span>approximate (sangkat + khan, or a blurred site coordinate)</span>
    <span>{{ count }} pinned listing{{ '' if count == 1 else 's' }}</span>
    <a href="{{ url_for('index') }}">view as list</a>
  </div>
</header>

<form class="filters" method="get">
  <input type="number" name="min_price" placeholder="Min $" value="{{ filters.get('min_price', '') }}">
  <input type="number" name="max_price" placeholder="Max $" value="{{ filters.get('max_price', '') }}">

  <select name="location">
    <option value="">Any location</option>
    {% for loc in locations %}
      <option value="{{ loc }}" {{ 'selected' if filters.get('location') == loc }}>{{ loc }}</option>
    {% endfor %}
  </select>

  <select name="property_type">
    <option value="">Any type</option>
    {% for pt in property_types %}
      <option value="{{ pt }}" {{ 'selected' if filters.get('property_type') == pt }}>{{ pt }}</option>
    {% endfor %}
  </select>

  <select name="listing_kind">
    <option value="">Sale or rent</option>
    <option value="sale" {{ 'selected' if filters.get('listing_kind') == 'sale' }}>For sale</option>
    <option value="rent" {{ 'selected' if filters.get('listing_kind') == 'rent' }}>For rent</option>
  </select>

  <select name="source_name">
    <option value="">Any source group</option>
    {% for s in sources %}
      <option value="{{ s }}" {{ 'selected' if filters.get('source_name') == s }}>{{ s }}</option>
    {% endfor %}
  </select>

  <select name="pin_tier">
    <option value="">Both pin types</option>
    <option value="real_link" {{ 'selected' if filters.get('pin_tier') == 'real_link' }}>Real map link only</option>
    <option value="sangkat_khan" {{ 'selected' if filters.get('pin_tier') == 'sangkat_khan' }}>Approximate only</option>
  </select>

  <input type="text" name="q" placeholder="Search text..." value="{{ filters.get('q', '') }}">
  <button type="submit">Filter</button>
  <a href="{{ url_for('map_view') }}" class="clear-link">Clear</a>
</form>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  const listings = {{ listings | tojson }};

  function esc(s) {
    return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  const map = L.map("map").setView([11.5564, 104.9282], 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // Listings are geocoded at the neighborhood level, so many share the
  // exact same coordinate -- cluster them so overlapping pins don't just
  // silently stack and hide each other.
  const clusterGroup = L.markerClusterGroup();

  listings.forEach(l => {
    if (l.lat == null || l.lon == null) return;
    const price = l.price_value ? ("$" + Number(l.price_value).toLocaleString()) : "price n/a";
    const tags = [l.listing_kind, l.property_type, l.location, l.size_text].filter(Boolean).join(" · ");
    const photo = (l.photo_paths && l.photo_paths.length)
      ? `<img src="/photos/${esc(l.photo_paths[0])}" style="width:100%;height:100px;object-fit:cover;margin-bottom:8px;">`
      : "";
    const mapLink = l.maps_link ? `<a href="${esc(l.maps_link)}" target="_blank" rel="noopener">map</a>` : "";
    const openLink = l.message_link ? `<a href="${esc(l.message_link)}" target="_blank" rel="noopener">open</a>` : "";
    const precise = l.pin_tier === "real_link";
    const precisionNote = precise ? "" : `<div class="popup-precision">approximate · ${l.pin_basis === "site_coordinate" ? "blurred coordinate from the listing site" : "sangkat-level"}</div>`;

    const marker = L.circleMarker([l.lat, l.lon], {
      radius: 9, weight: 2, color: "#fff",
      fillColor: precise ? "#1d6f52" : "#2f5fa8",
      fillOpacity: 0.95,
    });
    marker.bindPopup(`
      <div class="popup-card">
        ${photo}
        <div class="popup-price">${esc(price)}</div>
        ${precisionNote}
        <div class="popup-tags">${esc(tags)}</div>
        <div class="popup-text">${esc((l.raw_text || "").slice(0, 140))}</div>
        <div class="popup-links">${mapLink}${openLink}</div>
      </div>
    `);
    clusterGroup.addLayer(marker);
  });

  map.addLayer(clusterGroup);
  if (listings.length) {
    // At this point in page load, Leaflet's own CSS may not have finished
    // applying yet, so the container's measured size is still stale and
    // fitBounds clamps to zoom 0 (whole world) even though it centers
    // correctly. Deferring one tick lets layout settle first.
    setTimeout(() => {
      map.invalidateSize();
      map.fitBounds(clusterGroup.getBounds().pad(0.15));
    }, 0);
  }
</script>

</body>
</html>

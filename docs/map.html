<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambodia Listings Tracker — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --ink: #1f2320; --muted: #6b7268;
    --line: #e3e1da; --accent: #2f6f4f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--card); }
  h1 { margin: 0 0 4px; font-size: 1.2rem; }
  .sub { color: var(--muted); font-size: 0.85rem; }
  .sub a { color: var(--accent); }
  form.filters {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 24px;
    background: var(--card); border-bottom: 1px solid var(--line);
  }
  form.filters input, form.filters select {
    padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 0.85rem; background: white;
  }
  form.filters input[type="number"] { width: 90px; }
  form.filters button {
    padding: 6px 14px; border: none; border-radius: 6px; background: var(--accent); color: white; cursor: pointer;
  }
  #map { flex: 1; }
  .popup-card { width: 220px; }
  .popup-price { font-weight: 600; font-size: 1rem; }
  .popup-tags { font-size: 0.72rem; color: var(--muted); margin: 2px 0 6px; }
  .popup-text { font-size: 0.8rem; max-height: 4.5em; overflow: hidden; margin-bottom: 6px; }
  .popup-links a { color: var(--accent); margin-right: 8px; font-size: 0.8rem; }
  .leaflet-popup-content { margin: 10px; }
</style>
</head>
<body>

<header>
  <h1>Cambodia Listings Tracker — Map</h1>
  <div class="sub"><span id="count"></span> &middot; <a href="index.html">view as list</a></div>
</header>

<form class="filters" id="filters">
  <input type="number" id="min_price" placeholder="Min $">
  <input type="number" id="max_price" placeholder="Max $">

  <select id="location"><option value="">Any location</option></select>
  <select id="property_type"><option value="">Any type</option></select>

  <select id="listing_kind">
    <option value="">Sale or rent</option>
    <option value="sale">For sale</option>
    <option value="rent">For rent</option>
  </select>

  <select id="source_name"><option value="">Any source group</option></select>

  <input type="text" id="q" placeholder="Search text...">
  <button type="submit">Filter</button>
  <a href="#" id="clear" style="align-self:center; font-size:0.85rem; color:var(--muted);">Clear</a>
</form>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  let listings = [];
  let clusterGroup;

  function esc(s) {
    return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function uniqueSorted(arr) { return [...new Set(arr.filter(Boolean))].sort(); }
  function populateSelect(sel, values) {
    values.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v; opt.textContent = v;
      sel.appendChild(opt);
    });
  }

  const map = L.map("map").setView([11.5564, 104.9282], 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  function render() {
    const minP = parseFloat(document.getElementById("min_price").value);
    const maxP = parseFloat(document.getElementById("max_price").value);
    const loc = document.getElementById("location").value;
    const ptype = document.getElementById("property_type").value;
    const kind = document.getElementById("listing_kind").value;
    const src = document.getElementById("source_name").value;
    const q = document.getElementById("q").value.trim().toLowerCase();

    const filtered = listings.filter(l => {
      if (!isNaN(minP) && !(l.price_value >= minP)) return false;
      if (!isNaN(maxP) && !(l.price_value <= maxP)) return false;
      if (loc && l.location !== loc) return false;
      if (ptype && l.property_type !== ptype) return false;
      if (kind && l.listing_kind !== kind) return false;
      if (src && l.source_name !== src) return false;
      if (q && !(l.raw_text || "").toLowerCase().includes(q)) return false;
      return true;
    });

    document.getElementById("count").textContent = `${filtered.length} pinned listing${filtered.length === 1 ? "" : "s"}`;

    if (clusterGroup) map.removeLayer(clusterGroup);
    clusterGroup = L.markerClusterGroup();

    filtered.forEach(l => {
      if (l.lat == null || l.lon == null) return;
      const price = l.price_value ? ("$" + Number(l.price_value).toLocaleString()) : "price n/a";
      const tags = [l.listing_kind, l.property_type, l.location, l.size_text].filter(Boolean).join(" · ");
      const photo = (l.photo_paths && l.photo_paths.length)
        ? `<img src="photos/${esc(l.photo_paths[0])}" style="width:100%;height:100px;object-fit:cover;border-radius:6px;margin-bottom:6px;">`
        : "";
      const mapLink = l.maps_link ? `<a href="${esc(l.maps_link)}" target="_blank" rel="noopener">map</a>` : "";
      const openLink = l.message_link ? `<a href="${esc(l.message_link)}" target="_blank" rel="noopener">open</a>` : "";

      const marker = L.marker([l.lat, l.lon]);
      marker.bindPopup(`
        <div class="popup-card">
          ${photo}
          <div class="popup-price">${esc(price)}</div>
          <div class="popup-tags">${esc(tags)}</div>
          <div class="popup-text">${esc((l.raw_text || "").slice(0, 140))}</div>
          <div class="popup-links">${mapLink}${openLink}</div>
        </div>
      `);
      clusterGroup.addLayer(marker);
    });

    map.addLayer(clusterGroup);
    if (filtered.length) {
      setTimeout(() => {
        map.invalidateSize();
        map.fitBounds(clusterGroup.getBounds().pad(0.15));
      }, 0);
    }
  }

  document.getElementById("filters").addEventListener("submit", e => { e.preventDefault(); render(); });
  document.getElementById("clear").addEventListener("click", e => {
    e.preventDefault();
    document.getElementById("filters").reset();
    render();
  });

  fetch("listings.json").then(r => r.json()).then(data => {
    listings = data;
    populateSelect(document.getElementById("location"), uniqueSorted(listings.map(l => l.location)));
    populateSelect(document.getElementById("property_type"), uniqueSorted(listings.map(l => l.property_type)));
    populateSelect(document.getElementById("source_name"), uniqueSorted(listings.map(l => l.source_name)));
    render();
  });
</script>

</body>
</html>
